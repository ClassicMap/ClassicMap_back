# 공개 클립의 음량 곡선을 클러스터 안에서 잰다. 결과 JSONL 은 Job 로그로 나온다.
#
#   RUN=loudness-2026-10-01
#   # 측정할 클립 목록(manifest.jsonl)은 DB 를 읽어 만든다. 만드는 SELECT 는
#   # seed_pipeline/curation/loudness-2026-10-01/README.md 에 있다.
#   kubectl -n homeserver create configmap loudness-measure-$RUN \
#     --from-file=measure_loudness.py=scripts/measure_loudness.py \
#     --from-file=manifest.jsonl=<manifest.jsonl>
#   sed "s|__RUN__|$RUN|g" deploy/loudness-measure-job.yaml | kubectl apply -f -
#   kubectl -n homeserver wait --for=condition=complete --timeout=60m job/loudness-measure-$RUN
#   kubectl -n homeserver logs job/loudness-measure-$RUN | grep '^{' > profiles.jsonl
#
# 끝나면 지운다.
#   kubectl -n homeserver delete job loudness-measure-$RUN
#   kubectl -n homeserver delete configmap loudness-measure-$RUN
#
# ffmpeg 가 든 클리퍼 이미지를 쓴다. DB 에도 클리퍼에도 쓰지 않고, 클립 캐시는
# 읽기 전용으로 붙인다. 캐시 PVC 는 ReadWriteOnce 라 노드가 늘면 클리퍼와 같은
# 노드에 붙도록 podAffinity 를 넣어야 한다(seed-publish-job.yaml 과 같다).
apiVersion: batch/v1
kind: Job
metadata:
  name: loudness-measure-__RUN__
  namespace: homeserver
  labels:
    app: classicmap-loudness
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: classicmap-loudness
    spec:
      restartPolicy: Never
      containers:
        - name: measure
          # 클리퍼 Deployment 와 같은 태그. 바꾸면 analyzer_version 도 올린다(ffmpeg 이 바뀔 수 있다)
          image: ghcr.io/classicmap/classicmap-clipper:ytdlp-20260922-srccache2
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - /work/measure_loudness.py
            - --manifest
            - /work/manifest.jsonl
            - --cache-dir
            - /var/cache/classicmap-video-clips
          volumeMounts:
            - name: clip-cache
              mountPath: /var/cache/classicmap-video-clips
              readOnly: true
            - name: work
              mountPath: /work
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
      volumes:
        - name: clip-cache
          persistentVolumeClaim:
            claimName: clipper-cache
            readOnly: true
        - name: work
          configMap:
            name: loudness-measure-__RUN__
